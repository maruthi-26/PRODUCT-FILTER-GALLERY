<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">
    <header class="bg-white border-b shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold text-gray-800">Product Filter Gallery</h1>
        </div>
    </header>
    <main class="max-w-7xl mx-auto px-4 py-8">
        <section class="bg-white p-6 rounded-xl border shadow-sm mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Filters</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Search</label>
                    <input id="searchInput" type="text" placeholder="Search products..." class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-400 outline-none" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Category</label>
                    <select id="categoryFilter" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-400 outline-none">
                        <option value="all">All Category</option>
                        <option value="clothing">Men's Clothing</option>
                        <option value="electronics">Electronics</option>
                        <option value="home">Home</option>
                        <option value="books">Books</option>

                    </select>
                </div>
                <!-- Price -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Price Range</label>
                    <select id="priceFilter" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-gray-400 outline-none">
                        <option value="all">All Prices</option>
                        <option value="0-1000">₹0 - ₹1000</option>
                        <option value="1000-2500">₹1000 - ₹2500</option>
                        <option value="2500-5000">₹2500 - ₹5000</option>
                        <option value="5000-10000">₹5000-₹10000</option>
                        <option value="10000+">₹10000+</option>
                    </select>
                </div>
            </div>
            <!-- Reset Button -->
            <div class="mt-4">
                <button id="resetBtn" class="px-6 py-2 bg-gray-800 text-white rounded-lg hover:bg-red-700 transition"> Reset Filters</button>
            </div>
        </section>
        <!-- Result Count -->
        <p class="text-gray-600 mb-4"> Showing <span id="resultCount" class="font-bold">0</span> products </p>
        <!-- Product Grid -->
        <section id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></section>
        <!-- No Results -->
        <div id="noResults" class="hidden text-center py-10">
            <p class="text-gray-500 text-lg">No products found 😢😢</p>
        </div>
    </main>
    <script src="PRODUCT FILTER GALLERY.js"></script>
    

</body>

</html>
